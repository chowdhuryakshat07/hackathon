<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICU — I See You | AI Professional Inbox Lifesaver</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #080c14; color: #f8fafc; font-family: 'Inter', sans-serif; }
    h1,h2,h3,h4 { font-family: 'Outfit', 'Inter', sans-serif; }
    .gradient-text {
      background: linear-gradient(135deg, #818cf8 0%, #38bdf8 50%, #34d399 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #080c14; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#080c14] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Helpers ───────────────────────────────────────────────────────────────
    function classifyEmail(subject, snippet, from) {
      const text = (subject + ' ' + snippet + ' ' + from).toLowerCase();
      const urgentWords = ['urgent', 'asap', 'immediately', 'time-sensitive', 'critical', 'overdue',
        'action required', 'deadline', 'please reply', 'awaiting your response', 'response needed',
        'last chance', 'expires soon', 'follow up', 'important update', 'respond now'];
      const importantWords = ['important', 'meeting', 'interview', 'offer', 'approval', 'invoice',
        'payment', 'due', 'schedule', 'confirm', 'request', 'task', 'assigned', 'review needed',
        'please review', 'feedback', 'proposal', 'contract', 'reminder'];
      const lowWords = ['unsubscribe', 'newsletter', 'promotion', 'deal', 'sale', 'discount',
        'marketing', 'no-reply', 'noreply', 'digest', 'weekly', 'monthly', 'automated',
        'notification', 'subscription', 'promo', 'offer expires'];
      if (urgentWords.some(w => text.includes(w))) return 'URGENT';
      if (lowWords.some(w => text.includes(w))) return 'LOW';
      if (importantWords.some(w => text.includes(w))) return 'IMPORTANT';
      return 'INFO';
    }

    function extractDeadline(text) {
      const t = text.toLowerCase();
      const patterns = [
        /by\s+(today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i,
        /by\s+(\w+ \d{1,2}(?:st|nd|rd|th)?)/i,
        /due\s+(today|tomorrow|on \w+|\w+ \d{1,2})/i,
        /before\s+(eod|cob|end of day|end of week|\w+ \d{1,2})/i,
        /(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/,
      ];
      for (const p of patterns) {
        const m = t.match(p);
        if (m) return m[0];
      }
      return null;
    }

    function relativeTime(date) {
      const diff = Math.floor((Date.now() - date) / 1000);
      if (diff < 60)    return 'Just now';
      if (diff < 3600)  return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return `${Math.floor(diff/86400)}d ago`;
    }

    function generateReply(sender, subject) {
      const first = (sender || 'there').split(' ')[0];
      return `Hi ${first},\n\nThank you for your message regarding "${subject}".\n\nI have reviewed your email and will respond with a complete update shortly.\n\nBest regards`;
    }

    // ── Priority Badge Component ───────────────────────────────────────────────
    function PriorityBadge({ p }) {
      const styles = {
        URGENT:    'bg-rose-500/20 text-rose-400 border-rose-500/40',
        IMPORTANT: 'bg-amber-500/20 text-amber-400 border-amber-500/40',
        INFO:      'bg-emerald-500/20 text-emerald-400 border-emerald-500/40',
        LOW:       'bg-slate-700 text-slate-400 border-slate-600'
      };
      const labels = { URGENT:'🔴 Urgent', IMPORTANT:'🟠 Important', INFO:'🟢 Info', LOW:'⚪ Low' };
      return <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${styles[p]}`}>{labels[p]}</span>;
    }

    // ── Email Card Component ──────────────────────────────────────────────────
    function EmailCard({ email, onView, onDraft }) {
      return (
        <div
          className={`p-4 rounded-2xl border cursor-pointer transition-all hover:border-slate-600 ${
            email.isUnread ? 'bg-slate-900 border-slate-700' : 'bg-[#0d1424] border-slate-800'
          }`}
          onClick={() => onView(email)}
        >
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <PriorityBadge p={email.priority} />
            {email.isUnread && <span className="w-2 h-2 rounded-full bg-indigo-400 flex-shrink-0"></span>}
            <span className="text-[11px] text-slate-500 ml-auto">{email.timeAgo}</span>
          </div>
          <p className="text-xs font-bold text-slate-300 truncate">{email.sender}</p>
          <p className="text-sm font-semibold text-white mt-0.5 truncate">{email.subject}</p>
          <p className="text-[11px] text-slate-400 mt-1 line-clamp-2">{email.snippet}</p>
          {email.deadline && (
            <div className="mt-2 inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-amber-500/10 border border-amber-500/30">
              <span className="text-[10px] font-bold text-amber-400">⏰ {email.deadline}</span>
            </div>
          )}
          <div className="flex gap-2 mt-3 pt-3 border-t border-slate-800">
            <button
              onClick={e => { e.stopPropagation(); onDraft(email); }}
              className="flex-1 py-1.5 rounded-xl bg-indigo-600/30 text-indigo-300 font-bold text-[11px] hover:bg-indigo-600/50 transition-all"
            >
              Draft Reply
            </button>
            <button
              onClick={e => { e.stopPropagation(); onView(email); }}
              className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-400 text-[11px] hover:bg-slate-700 transition-all"
            >
              View
            </button>
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      // ALL state at top level — no exceptions
      const [view, setView]               = useState('landing');   // 'landing' | 'loading' | 'dashboard'
      const [activeTab, setActiveTab]     = useState('summary');
      const [clientId, setClientId]       = useState(() => localStorage.getItem('icu_client_id') || '');
      const [accessToken, setAccessToken] = useState(null);
      const [userEmail, setUserEmail]     = useState('');
      const [emails, setEmails]           = useState([]);
      const [loadingMsg, setLoadingMsg]   = useState('');
      const [loadPct, setLoadPct]         = useState(0);
      const [error, setError]             = useState('');
      const [showModal, setShowModal]     = useState(false);
      const [selectedEmail, setSelectedEmail] = useState(null);
      const [selectedReply, setSelectedReply] = useState(null);
      const [draftText, setDraftText]     = useState('');
      const [copied, setCopied]           = useState(false);
      const [timeframe, setTimeframe]     = useState('3');
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const saveClientId = v => { setClientId(v); localStorage.setItem('icu_client_id', v); };

      // Derived lists
      const urgent    = emails.filter(e => e.priority === 'URGENT');
      const important = emails.filter(e => e.priority === 'IMPORTANT');
      const info      = emails.filter(e => e.priority === 'INFO');
      const low       = emails.filter(e => e.priority === 'LOW');
      const deadlines = [...urgent, ...important].filter(e => e.deadline);

      const filterEmails = arr => {
        if (!searchQuery.trim()) return arr;
        const q = searchQuery.toLowerCase();
        return arr.filter(e =>
          e.subject.toLowerCase().includes(q) ||
          e.sender.toLowerCase().includes(q) ||
          e.snippet.toLowerCase().includes(q)
        );
      };

      // ── Google OAuth Sign-in ────────────────────────────────────────────────
      const handleSignIn = () => {
        if (!clientId.trim()) { setError('Please enter your Google OAuth Client ID.'); return; }
        if (!window.google?.accounts?.oauth2) { setError('Google Identity Services not loaded.'); return; }
        setError('');
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: clientId.trim(),
          scope: 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
          callback: async res => {
            if (res.error) { setError('Sign-in failed: ' + (res.error_description || res.error)); return; }
            setAccessToken(res.access_token);
            await loadInbox(res.access_token);
          }
        });
        client.requestAccessToken();
      };

      // ── Fetch real Gmail inbox ──────────────────────────────────────────────
      const loadInbox = async (token) => {
        setView('loading');
        setLoadPct(5);
        setShowModal(false);
        setEmails([]);
        try {
          setLoadingMsg('Fetching your Google profile...');
          const pRes = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (pRes.ok) {
            const p = await pRes.json();
            setUserEmail(p.email);
          }
          setLoadPct(15);

          setLoadingMsg('Scanning your inbox...');
          const listRes = await fetch(
            `https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=50&q=newer_than:${timeframe}d`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          if (!listRes.ok) throw new Error(`Gmail API ${listRes.status}: ${listRes.statusText}`);
          const listData = await listRes.json();
          const msgIds = (listData.messages || []).slice(0, 40);
          setLoadPct(25);

          const fetched = [];
          for (let i = 0; i < msgIds.length; i++) {
            const pct = Math.round(25 + ((i + 1) / msgIds.length) * 70);
            setLoadPct(pct);
            setLoadingMsg(`Reading email ${i + 1} of ${msgIds.length}...`);

            const mRes = await fetch(
              `https://gmail.googleapis.com/gmail/v1/users/me/messages/${msgIds[i].id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`,
              { headers: { Authorization: `Bearer ${token}` } }
            );
            if (!mRes.ok) continue;
            const m = await mRes.json();

            const hdrs = m.payload?.headers || [];
            const getH = name => hdrs.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || '';
            const fromRaw = getH('From');
            const fromMatch = fromRaw.match(/(.*?)\s*<([^>]+)>/);
            const sender = fromMatch ? fromMatch[1].replace(/^"|"$/g, '').trim() : fromRaw.split('@')[0];
            const senderEmail = fromMatch ? fromMatch[2] : fromRaw;
            const subject = getH('Subject') || '(No subject)';
            const dateStr = getH('Date');
            const snippet = m.snippet || '';
            const isUnread = (m.labelIds || []).includes('UNREAD');
            const priority = classifyEmail(subject, snippet, fromRaw);
            const deadline = extractDeadline(subject + ' ' + snippet);
            const timeAgo = dateStr ? relativeTime(new Date(dateStr)) : '';

            fetched.push({ id: m.id, threadId: m.threadId, sender, senderEmail, subject, snippet, timeAgo, isUnread, priority, deadline });
          }

          setLoadPct(100);
          setLoadingMsg('Done!');
          setEmails(fetched);
          setActiveTab('summary');
          setView('dashboard');
        } catch (e) {
          setError('Failed to load inbox: ' + e.message);
          setView('landing');
          setShowModal(true);
        }
      };

      const rescan = () => { if (accessToken) loadInbox(accessToken); };

      const openDraft = email => {
        setDraftText(generateReply(email.sender, email.subject));
        setSelectedReply(email);
        setSelectedEmail(null);
      };

      // ────────────────────────────────────────────────────────────────────────
      // RENDER — single return
      // ────────────────────────────────────────────────────────────────────────
      return (
        <div className="min-h-screen flex flex-col bg-[#080c14]">

          {/* ── LOADING VIEW ────────────────────────────────────────────────── */}
          {view === 'loading' && (
            <div className="flex-1 flex flex-col items-center justify-center gap-6 p-8">
              <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-600 to-cyan-500 flex items-center justify-center shadow-2xl shadow-indigo-500/40">
                <i data-lucide="eye" className="w-10 h-10 text-white animate-pulse"></i>
              </div>
              <div className="text-center">
                <h2 className="font-display text-2xl font-bold text-white">ICU is scanning your inbox</h2>
                <p className="text-sm text-slate-400 mt-2">{loadingMsg}</p>
              </div>
              <div className="w-72">
                <div className="flex justify-between text-[11px] text-slate-500 mb-2">
                  <span>Progress</span><span>{loadPct}%</span>
                </div>
                <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                  <div
                    className="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full rounded-full transition-all duration-300"
                    style={{ width: `${loadPct}%` }}
                  ></div>
                </div>
              </div>
            </div>
          )}

          {/* ── LANDING VIEW ────────────────────────────────────────────────── */}
          {view === 'landing' && (
            <div className="flex-1 flex flex-col items-center justify-center px-4 py-16">
              <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-600 to-cyan-500 flex items-center justify-center shadow-2xl shadow-indigo-500/30 mb-8">
                <i data-lucide="eye" className="w-10 h-10 text-white"></i>
              </div>
              <h1 className="font-display text-6xl sm:text-7xl font-extrabold text-white mb-4 text-center">
                I See <span className="gradient-text">You.</span>
              </h1>
              <p className="font-display text-xl text-indigo-200 max-w-xl text-center mb-4">
                AI-powered inbox intelligence for busy professionals
              </p>
              <p className="text-sm text-slate-400 max-w-lg text-center mb-10">
                Connect your Gmail and ICU instantly scans your real inbox, categorizes every email by priority, spots deadlines, and tells you exactly what needs your attention.
              </p>

              <button
                onClick={() => setShowModal(true)}
                className="flex items-center gap-3 rounded-2xl bg-white text-slate-900 hover:bg-slate-100 px-8 py-4 text-base font-extrabold shadow-2xl hover:scale-105 transition-all mb-4"
              >
                <svg className="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Connect Gmail &amp; Scan Inbox
              </button>
              <p className="text-[11px] text-slate-500">Read-only access • Official Google OAuth 2.0 • No data stored</p>

              {/* CONNECT MODAL */}
              {showModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                  <div className="w-full max-w-md rounded-3xl bg-[#0f172a] border border-white/10 p-6 space-y-5 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                      <h3 className="font-display text-lg font-bold text-white">Connect Your Real Gmail</h3>
                      <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white p-1 text-lg">✕</button>
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-300">Google OAuth Client ID</label>
                      <input
                        type="text"
                        value={clientId}
                        onChange={e => saveClientId(e.target.value)}
                        placeholder="xxxxxxxxxx.apps.googleusercontent.com"
                        className="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white placeholder-slate-500 font-mono focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      />
                    </div>

                    <div className="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-[11px] space-y-1">
                      <p className="font-bold text-indigo-300">One-time setup:</p>
                      <ol className="list-decimal pl-4 space-y-0.5 text-slate-300">
                        <li><a href="https://console.cloud.google.com/apis/credentials" target="_blank" className="text-cyan-400 underline">Cloud Console → Credentials</a> → Create OAuth Client → <strong>Web application</strong></li>
                        <li>Add <code className="text-amber-300 bg-slate-900 px-1 rounded">http://localhost:8080</code> to Authorized JS Origins</li>
                        <li><a href="https://console.cloud.google.com/auth/clients" target="_blank" className="text-cyan-400 underline">OAuth consent screen</a> → Audience → Add your email as test user</li>
                        <li>Paste Client ID above → Connect!</li>
                      </ol>
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs font-bold text-slate-300">Scan timeframe</label>
                      <select
                        value={timeframe}
                        onChange={e => setTimeframe(e.target.value)}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
                      >
                        <option value="1">Last 24 hours</option>
                        <option value="3">Last 3 days</option>
                        <option value="7">Last 7 days</option>
                        <option value="14">Last 2 weeks</option>
                      </select>
                    </div>

                    {error && <p className="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-xl p-3">{error}</p>}

                    <button
                      onClick={handleSignIn}
                      className="w-full py-4 rounded-2xl bg-white text-slate-900 font-extrabold text-sm flex items-center justify-center gap-3 hover:bg-slate-100 transition-all hover:scale-[1.02]"
                    >
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                      </svg>
                      Sign in with Google &amp; Scan Inbox
                    </button>
                    <p className="text-center text-[10px] text-slate-500">Official Google Identity OAuth 2.0 • Read-only • SSL Encrypted</p>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── DASHBOARD VIEW ──────────────────────────────────────────────── */}
          {view === 'dashboard' && (
            <div className="flex flex-col flex-1">
              {/* NAVBAR */}
              <header className="sticky top-0 z-40 border-b border-white/10 bg-[#080c14]/90 backdrop-blur-md">
                <div className="max-w-7xl mx-auto flex h-14 items-center justify-between px-4 gap-4">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-500 flex items-center justify-center">
                      <i data-lucide="eye" className="w-4 h-4 text-white"></i>
                    </div>
                    <span className="font-display font-bold text-white">ICU</span>
                    <span className="text-[10px] font-bold text-emerald-400 border border-emerald-500/40 bg-emerald-500/10 rounded px-1.5 py-0.5 hidden sm:block">
                      LIVE · {userEmail}
                    </span>
                  </div>

                  <div className="flex-1 max-w-sm hidden sm:block">
                    <div className="relative">
                      <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500"></i>
                      <input
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                        placeholder="Search your inbox..."
                        className="w-full pl-9 pr-4 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <select
                      value={timeframe}
                      onChange={e => setTimeframe(e.target.value)}
                      className="rounded-lg bg-slate-900 border border-slate-700 px-2 py-1.5 text-xs text-slate-200"
                    >
                      <option value="1">24h</option>
                      <option value="3">3 days</option>
                      <option value="7">7 days</option>
                      <option value="14">2 weeks</option>
                    </select>
                    <button
                      onClick={rescan}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-bold hover:bg-indigo-600/50 transition-all"
                    >
                      <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i>
                      <span className="hidden sm:block">Rescan</span>
                    </button>
                  </div>
                </div>
              </header>

              <div className="flex flex-1 max-w-7xl w-full mx-auto">
                {/* SIDEBAR */}
                <aside className="w-52 flex-shrink-0 border-r border-white/10 p-4 hidden md:flex flex-col justify-between">
                  <nav className="space-y-1 mt-2">
                    {[
                      { id:'summary',   label:'📊 Summary',       count: emails.length },
                      { id:'urgent',    label:'🔴 Urgent',         count: urgent.length },
                      { id:'important', label:'🟠 Important',      count: important.length },
                      { id:'deadlines', label:'📅 Deadlines',      count: deadlines.length },
                      { id:'info',      label:'🟢 Info',            count: info.length },
                      { id:'low',       label:'⚪ Low Priority',   count: low.length },
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                          activeTab === item.id
                            ? 'bg-indigo-600/30 text-white border border-indigo-500/40'
                            : 'text-slate-400 hover:text-white hover:bg-slate-900/60'
                        }`}
                      >
                        <span>{item.label}</span>
                        {item.count > 0 && (
                          <span className="text-[10px] bg-slate-800 text-slate-400 border border-slate-700 px-1.5 py-0.5 rounded font-bold">{item.count}</span>
                        )}
                      </button>
                    ))}
                  </nav>

                  <div className="pt-4 border-t border-slate-800">
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-indigo-500 to-cyan-500 flex items-center justify-center text-white text-[10px] font-bold">
                        {userEmail?.[0]?.toUpperCase() || '?'}
                      </div>
                      <div className="min-w-0">
                        <p className="text-[10px] font-bold text-white truncate">{userEmail}</p>
                        <p className="text-[9px] text-emerald-400">Live Connected</p>
                      </div>
                    </div>
                  </div>
                </aside>

                {/* MAIN CONTENT */}
                <main className="flex-1 p-6 overflow-y-auto min-h-0">

                  {/* SUMMARY */}
                  {activeTab === 'summary' && (
                    <div className="space-y-6">
                      <div>
                        <h1 className="font-display text-3xl font-extrabold text-white">While You Were Away</h1>
                        <p className="text-xs text-slate-400 mt-1">
                          Scanned <strong className="text-white">{emails.length}</strong> real emails from <strong className="text-white">{userEmail}</strong>
                        </p>
                      </div>

                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        {[
                          { label:'🔴 Urgent',    count: urgent.length,    tab:'urgent',    bg:'bg-rose-950/20 border-rose-500/30 hover:border-rose-500',    text:'text-rose-400',    sub:'Need immediate reply' },
                          { label:'🟠 Important', count: important.length, tab:'important', bg:'bg-amber-950/20 border-amber-500/30 hover:border-amber-500',  text:'text-amber-400',   sub:'Action due soon' },
                          { label:'🟢 Info',      count: info.length,      tab:'info',      bg:'bg-emerald-950/20 border-emerald-500/30 hover:border-emerald-500', text:'text-emerald-400', sub:'FYIs & updates' },
                          { label:'⚪ Low',       count: low.length,       tab:'low',       bg:'bg-slate-900 border-slate-800 hover:border-slate-700',         text:'text-slate-400',   sub:'Can wait' },
                        ].map(s => (
                          <div key={s.tab} onClick={() => setActiveTab(s.tab)}
                            className={`p-4 rounded-2xl border cursor-pointer transition-all hover:scale-[1.02] ${s.bg}`}>
                            <p className={`text-xs font-bold uppercase ${s.text}`}>{s.label}</p>
                            <p className="text-4xl font-extrabold text-white mt-1">{s.count}</p>
                            <p className="text-[11px] text-slate-400 mt-1">{s.sub}</p>
                          </div>
                        ))}
                      </div>

                      {urgent.length > 0 && (
                        <div className="space-y-3">
                          <h2 className="font-display text-xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="zap" className="w-5 h-5 text-rose-400"></i> Needs Your Attention Now
                          </h2>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {urgent.slice(0, 4).map(e => (
                              <EmailCard key={e.id} email={e} onView={setSelectedEmail} onDraft={openDraft} />
                            ))}
                          </div>
                          {urgent.length > 4 && (
                            <button onClick={() => setActiveTab('urgent')} className="text-xs text-indigo-400 hover:text-indigo-300 font-semibold">
                              View all {urgent.length} urgent emails →
                            </button>
                          )}
                        </div>
                      )}

                      {deadlines.length > 0 && (
                        <div className="space-y-3">
                          <h2 className="font-display text-xl font-bold text-white flex items-center gap-2">
                            <i data-lucide="calendar" className="w-5 h-5 text-amber-400"></i> Detected Deadlines
                          </h2>
                          <div className="space-y-2">
                            {deadlines.map(e => (
                              <div key={e.id} onClick={() => setSelectedEmail(e)}
                                className="p-4 rounded-2xl bg-slate-900 border border-amber-500/20 flex items-center justify-between cursor-pointer hover:border-amber-500/40 transition-all">
                                <div className="min-w-0">
                                  <p className="text-xs font-bold text-white truncate">{e.subject}</p>
                                  <p className="text-[11px] text-slate-400">From: {e.sender}</p>
                                </div>
                                <span className="px-3 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[11px] font-bold whitespace-nowrap ml-4">{e.deadline}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {emails.length === 0 && (
                        <div className="text-center py-20 text-slate-500">
                          <i data-lucide="inbox" className="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                          <p className="text-sm">No emails found for the last {timeframe} day(s).</p>
                          <button onClick={rescan} className="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Try a longer timeframe</button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* URGENT */}
                  {activeTab === 'urgent' && (
                    <div className="space-y-4">
                      <h1 className="font-display text-3xl font-extrabold text-white">🔴 Urgent — Act Now</h1>
                      {filterEmails(urgent).length === 0
                        ? <p className="text-slate-500 text-sm py-12 text-center">No urgent emails found.</p>
                        : <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{filterEmails(urgent).map(e => <EmailCard key={e.id} email={e} onView={setSelectedEmail} onDraft={openDraft} />)}</div>
                      }
                    </div>
                  )}

                  {/* IMPORTANT */}
                  {activeTab === 'important' && (
                    <div className="space-y-4">
                      <h1 className="font-display text-3xl font-extrabold text-white">🟠 Important</h1>
                      {filterEmails(important).length === 0
                        ? <p className="text-slate-500 text-sm py-12 text-center">No important emails found.</p>
                        : <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{filterEmails(important).map(e => <EmailCard key={e.id} email={e} onView={setSelectedEmail} onDraft={openDraft} />)}</div>
                      }
                    </div>
                  )}

                  {/* DEADLINES */}
                  {activeTab === 'deadlines' && (
                    <div className="space-y-4">
                      <h1 className="font-display text-3xl font-extrabold text-white">📅 Deadline Radar</h1>
                      {deadlines.length === 0
                        ? <p className="text-slate-500 text-sm py-12 text-center">No deadlines detected in your emails.</p>
                        : <div className="space-y-3">
                            {deadlines.map(e => (
                              <div key={e.id} onClick={() => setSelectedEmail(e)}
                                className="p-5 rounded-2xl bg-slate-900 border border-amber-500/20 flex items-center justify-between cursor-pointer hover:border-amber-500/40 transition-all">
                                <div className="min-w-0">
                                  <PriorityBadge p={e.priority} />
                                  <p className="text-sm font-bold text-white mt-1 truncate">{e.subject}</p>
                                  <p className="text-xs text-slate-400">From: {e.sender} · {e.timeAgo}</p>
                                </div>
                                <span className="px-3 py-1.5 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold whitespace-nowrap ml-4">{e.deadline}</span>
                              </div>
                            ))}
                          </div>
                      }
                    </div>
                  )}

                  {/* INFO */}
                  {activeTab === 'info' && (
                    <div className="space-y-4">
                      <h1 className="font-display text-3xl font-extrabold text-white">🟢 Informational</h1>
                      {filterEmails(info).length === 0
                        ? <p className="text-slate-500 text-sm py-12 text-center">No informational emails found.</p>
                        : <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{filterEmails(info).map(e => <EmailCard key={e.id} email={e} onView={setSelectedEmail} onDraft={openDraft} />)}</div>
                      }
                    </div>
                  )}

                  {/* LOW PRIORITY */}
                  {activeTab === 'low' && (
                    <div className="space-y-4">
                      <h1 className="font-display text-3xl font-extrabold text-white">⚪ Low Priority — Can Wait</h1>
                      {filterEmails(low).length === 0
                        ? <p className="text-slate-500 text-sm py-12 text-center">No low priority emails.</p>
                        : <div className="space-y-2">
                            {filterEmails(low).map(e => (
                              <div key={e.id} onClick={() => setSelectedEmail(e)}
                                className="p-3 rounded-xl bg-[#0d1424] border border-slate-800 flex items-center justify-between cursor-pointer hover:border-slate-700 transition-all">
                                <div className="min-w-0 flex-1">
                                  <p className="text-xs font-bold text-slate-300 truncate">{e.sender}</p>
                                  <p className="text-xs text-slate-500 truncate">{e.subject}</p>
                                </div>
                                <span className="text-[10px] text-slate-600 ml-4 whitespace-nowrap">{e.timeAgo}</span>
                              </div>
                            ))}
                          </div>
                      }
                    </div>
                  )}

                </main>
              </div>
            </div>
          )}

          {/* ── EMAIL DETAIL MODAL ───────────────────────────────────────────── */}
          {selectedEmail && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="w-full max-w-2xl rounded-3xl bg-[#0f172a] border border-white/10 flex flex-col max-h-[85vh] shadow-2xl">
                <div className="flex items-start justify-between border-b border-slate-800 p-5 gap-3">
                  <div className="min-w-0">
                    <PriorityBadge p={selectedEmail.priority} />
                    <h3 className="font-display text-base font-bold text-white mt-2">{selectedEmail.subject}</h3>
                  </div>
                  <button onClick={() => setSelectedEmail(null)} className="text-slate-400 hover:text-white p-1 text-lg flex-shrink-0">✕</button>
                </div>
                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs space-y-1.5">
                    <p><strong className="text-slate-400">FROM:</strong> <span className="text-slate-200">{selectedEmail.sender} &lt;{selectedEmail.senderEmail}&gt;</span></p>
                    <p><strong className="text-slate-400">RECEIVED:</strong> <span className="text-slate-200">{selectedEmail.timeAgo}</span></p>
                    {selectedEmail.deadline && (
                      <p><strong className="text-amber-400">DEADLINE DETECTED:</strong> <span className="text-amber-300 font-bold">{selectedEmail.deadline}</span></p>
                    )}
                  </div>
                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-300 leading-relaxed">
                    {selectedEmail.snippet}
                  </div>
                </div>
                <div className="border-t border-slate-800 p-4 flex gap-3 justify-end">
                  <button onClick={() => openDraft(selectedEmail)} className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-bold text-xs">Draft Reply</button>
                  <button onClick={() => setSelectedEmail(null)} className="px-5 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* ── DRAFT REPLY MODAL ────────────────────────────────────────────── */}
          {selectedReply && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="w-full max-w-xl rounded-3xl bg-[#0f172a] border border-white/10 flex flex-col shadow-2xl">
                <div className="flex items-start justify-between border-b border-slate-800 p-5">
                  <div>
                    <h3 className="font-display text-base font-bold text-white">AI Reply Draft</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5 truncate max-w-xs">Re: {selectedReply.subject}</p>
                  </div>
                  <button onClick={() => setSelectedReply(null)} className="text-slate-400 hover:text-white p-1 text-lg flex-shrink-0">✕</button>
                </div>
                <div className="p-5">
                  <textarea
                    value={draftText}
                    onChange={e => setDraftText(e.target.value)}
                    rows={7}
                    className="w-full rounded-xl bg-slate-950 border border-slate-700 p-4 text-sm text-slate-100 focus:outline-none font-sans resize-none leading-relaxed"
                  />
                </div>
                <div className="border-t border-slate-800 p-4 flex gap-3 justify-end">
                  <button onClick={() => setSelectedReply(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">Discard</button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(draftText);
                      setCopied(true);
                      setTimeout(() => setCopied(false), 2500);
                    }}
                    className="px-6 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                  >
                    {copied ? '✓ Copied!' : 'Copy to Clipboard'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
